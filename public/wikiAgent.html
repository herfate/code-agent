<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wiki Agent</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="/js/accessUser.js"></script>
  <script src="/js/claude-sse-render.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="h-full min-h-0 overflow-hidden bg-slate-50 text-slate-900 antialiased">
  <div class="flex h-full min-h-0 w-full flex-col gap-4 p-4">
    <header class="shrink-0 rounded-xl border border-slate-200 bg-white px-4 py-4 shadow-sm sm:px-5">
      <div class="flex items-center gap-3">
        <button type="button" id="wa-btn-back" class="hidden shrink-0 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 shadow-sm transition hover:bg-slate-50">返回</button>
        <div class="min-w-0">
          <h1 id="wa-title" class="text-base font-semibold text-slate-800">Wiki Agent</h1>
          <p id="wa-subtitle" class="mt-0.5 text-xs text-slate-500">选择业务分类，浏览 <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-[11px]">wiki_base</code> 下的知识库文档</p>
        </div>
      </div>
    </header>

    <!-- 分类卡片 -->
    <div id="wa-view-home" class="min-h-0 flex-1 overflow-y-auto">
      <div id="wa-cards" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>
    </div>

    <!-- 父故事列表（业务 Agent） -->
    <section id="wa-view-stories" class="hidden flex min-h-0 flex-1 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="flex shrink-0 items-center justify-between border-b border-slate-100 bg-slate-50/80 px-4 py-3">
        <h2 id="wa-stories-heading" class="text-xs font-semibold uppercase tracking-wide text-slate-500">父故事列表</h2>
        <span id="wa-stories-count" class="text-xs font-medium text-slate-500"></span>
      </div>
      <div class="min-h-0 flex-1 overflow-auto">
        <p id="wa-stories-error" class="hidden border-b border-red-100 bg-red-50/90 px-4 py-3 text-sm text-red-700"></p>
        <p id="wa-stories-loading" class="hidden px-4 py-10 text-center text-sm text-slate-500">加载中…</p>
        <p id="wa-stories-empty" class="hidden px-4 py-10 text-center text-sm text-slate-500">暂无父故事</p>
        <div class="overflow-x-auto">
          <table class="w-max min-w-full border-collapse text-left text-sm">
            <thead class="sticky top-0 z-10 border-b border-slate-200 bg-slate-100/95 text-xs font-semibold tracking-wide text-slate-600 backdrop-blur-sm">
              <tr>
                <th class="whitespace-nowrap px-4 py-3">编号</th>
                <th class="whitespace-nowrap px-4 py-3">标题</th>
                <th class="whitespace-nowrap px-4 py-3">描述</th>
                <th class="whitespace-nowrap px-4 py-3">执行状态</th>
                <th class="whitespace-nowrap px-4 py-3">创建人</th>
                <th class="whitespace-nowrap px-4 py-3">创建时间</th>
                <th class="whitespace-nowrap px-4 py-3">操作</th>
              </tr>
            </thead>
            <tbody id="wa-stories-tbody" class="divide-y divide-slate-100 text-slate-800"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 文件列表 -->
    <section id="wa-view-files" class="hidden flex min-h-0 flex-1 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="flex shrink-0 items-center justify-between border-b border-slate-100 bg-slate-50/80 px-4 py-3">
        <h2 id="wa-files-heading" class="text-xs font-semibold uppercase tracking-wide text-slate-500">文档列表</h2>
        <span id="wa-files-count" class="text-xs font-medium text-slate-500"></span>
      </div>
      <div id="wa-files-breadcrumb" class="hidden shrink-0 border-b border-slate-100 bg-white px-4 py-2 text-xs text-slate-600"></div>
      <div id="wa-files-scroll" class="min-h-0 flex-1 overflow-auto">
        <p id="wa-files-error" class="hidden border-b border-red-100 bg-red-50/90 px-4 py-3 text-sm text-red-700"></p>
        <p id="wa-files-loading" class="hidden px-4 py-10 text-center text-sm text-slate-500">加载中…</p>
        <p id="wa-files-empty" class="hidden px-4 py-10 text-center text-sm text-slate-500">该目录下暂无内容</p>
        <div id="wa-files-list" class="divide-y divide-slate-100"></div>
      </div>
    </section>
  </div>

  <!-- 文档源配置 -->
  <div id="wa-source-root" class="pointer-events-none fixed inset-0 z-50 hidden">
    <div id="wa-source-backdrop" class="pointer-events-auto flex h-full w-full items-center justify-center bg-slate-900/40 p-4 backdrop-blur-[1px]">
      <div id="wa-source-panel" role="dialog" aria-modal="true" aria-labelledby="wa-source-title" class="flex max-h-[85vh] w-full max-w-lg flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xl">
        <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-5 py-4">
          <div class="min-w-0">
            <h3 id="wa-source-title" class="text-sm font-semibold text-slate-800">文档源配置</h3>
            <p id="wa-source-sub" class="mt-1 text-xs text-slate-500"></p>
          </div>
          <button type="button" id="wa-source-close" class="shrink-0 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 shadow-sm hover:bg-slate-50">关闭</button>
        </div>
        <div id="wa-source-body" class="min-h-0 flex-1 overflow-y-auto px-5 py-4 text-sm text-slate-800"></div>
      </div>
    </div>
  </div>

  <!-- 父故事 ai_out 任务类型选择 -->
  <div id="wa-story-pick-root" class="pointer-events-none fixed inset-0 z-50 hidden">
    <div id="wa-story-pick-backdrop" class="pointer-events-auto flex h-full w-full items-center justify-center bg-slate-900/40 p-4 backdrop-blur-[1px]">
      <div id="wa-story-pick-panel" role="dialog" aria-modal="true" aria-labelledby="wa-story-pick-title" class="flex max-h-[85vh] w-full max-w-md flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xl">
        <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-5 py-4">
          <div class="min-w-0">
            <h3 id="wa-story-pick-title" class="text-sm font-semibold text-slate-800">选择任务类型</h3>
            <p id="wa-story-pick-sub" class="mt-1 text-xs text-slate-500">请选择要预览的 taskType（ai_out 子目录）</p>
          </div>
          <button type="button" id="wa-story-pick-close" class="shrink-0 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 shadow-sm hover:bg-slate-50">取消</button>
        </div>
        <div class="min-h-0 flex-1 overflow-y-auto px-5 py-4">
          <p id="wa-story-pick-empty" class="hidden text-center text-sm text-slate-500">该父任务下暂无可预览文档</p>
          <div id="wa-story-pick-list" class="grid gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 父故事 ai_out 文档预览 -->
  <div id="wa-story-ai-preview-root" class="pointer-events-none fixed inset-0 z-50 hidden">
    <div id="wa-story-ai-preview-backdrop" class="pointer-events-auto flex h-full w-full items-center justify-center bg-slate-900/40 p-4 backdrop-blur-[1px]">
      <div id="wa-story-ai-preview-panel" role="dialog" aria-modal="true" aria-labelledby="wa-story-ai-preview-title" class="flex h-[90vh] w-[80vw] max-h-[90vh] max-w-[80vw] flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xl">
        <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-5 py-4">
          <div class="min-w-0">
            <h3 id="wa-story-ai-preview-title" class="text-sm font-semibold text-slate-800">文档预览</h3>
            <p id="wa-story-ai-preview-meta" class="mt-1 truncate font-mono text-[11px] text-slate-500"></p>
          </div>
          <button type="button" id="wa-story-ai-preview-close" class="shrink-0 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 shadow-sm hover:bg-slate-50">关闭</button>
        </div>
        <div id="wa-story-ai-preview-body" class="min-h-0 flex-1 overflow-x-auto overflow-y-auto px-5 py-4 text-sm text-slate-800"></div>
      </div>
    </div>
  </div>

  <!-- 智能问答准备（勾选上下文来源） -->
  <div id="wa-qa-prep-root" class="pointer-events-none fixed inset-0 z-50 hidden">
    <div id="wa-qa-prep-backdrop" class="pointer-events-auto flex h-full w-full items-center justify-center bg-slate-900/40 p-4 backdrop-blur-[1px]">
      <div id="wa-qa-prep-panel" role="dialog" aria-modal="true" aria-labelledby="wa-qa-prep-title" class="flex w-full max-w-md flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xl">
        <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-5 py-4">
          <div class="min-w-0">
            <h3 id="wa-qa-prep-title" class="text-sm font-semibold text-slate-800">智能问答 · 准备上下文</h3>
            <p id="wa-qa-prep-sub" class="mt-1 text-xs text-slate-500">选择要载入 Agent 工作区的内容</p>
          </div>
          <button type="button" id="wa-qa-prep-close" class="shrink-0 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 shadow-sm hover:bg-slate-50">取消</button>
        </div>
        <div class="px-5 py-4">
          <div class="grid gap-3">
            <label class="flex cursor-pointer items-start gap-3 rounded-lg border border-slate-200 bg-slate-50/50 px-3 py-3 transition hover:border-emerald-200 hover:bg-emerald-50/40">
              <input type="checkbox" id="wa-qa-prep-confluence" class="mt-0.5 h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" checked />
              <span class="min-w-0">
                <span class="block text-sm font-medium text-slate-800">添加 Confluence 文档</span>
                <span class="mt-0.5 block text-xs text-slate-500">将 wiki_base 下已同步的知识库文档复制到工作区</span>
              </span>
            </label>
            <div id="wa-qa-prep-code-list" class="grid gap-3"></div>
          </div>
          <p id="wa-qa-prep-error" class="mt-3 hidden text-xs text-red-600"></p>
        </div>
        <div class="flex shrink-0 justify-end gap-2 border-t border-slate-100 px-5 py-4">
          <button type="button" id="wa-qa-prep-cancel" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 shadow-sm hover:bg-slate-50">取消</button>
          <button type="button" id="wa-qa-prep-start" class="rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white shadow-sm hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">开始问答</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 智能问答（Claude SSE） -->
  <div id="wa-qa-root" class="pointer-events-none fixed inset-0 z-50 hidden">
    <div id="wa-qa-backdrop" class="pointer-events-auto flex h-full w-full items-center justify-center bg-slate-900/40 p-4 backdrop-blur-[1px]">
      <div id="wa-qa-panel" role="dialog" aria-modal="true" aria-labelledby="wa-qa-title" class="flex h-[90vh] w-[80vw] max-h-[90vh] max-w-[80vw] flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xl">
        <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-5 py-4">
          <div class="min-w-0">
            <h3 id="wa-qa-title" class="text-sm font-semibold text-slate-800">智能问答</h3>
            <p id="wa-qa-sub" class="mt-1 text-xs text-slate-500">基于 Claude 实时回答，关闭窗口将中断当前对话</p>
          </div>
          <button type="button" id="wa-qa-close" class="shrink-0 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 shadow-sm hover:bg-slate-50">关闭</button>
        </div>
        <main id="wa-qa-log" class="chat-log min-h-0 flex-1 overflow-y-auto px-5 py-4" role="log" aria-live="polite"></main>
        <footer class="shrink-0 border-t border-slate-200 bg-white px-5 py-4">
          <textarea
            id="wa-qa-input"
            rows="3"
            maxlength="50000"
            placeholder="输入问题，Enter 发送，Shift+Enter 换行…"
            class="mb-2 w-full resize-y rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/25"
          ></textarea>
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" id="wa-qa-send" class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">发送</button>
            <span id="wa-qa-hint" class="text-xs text-slate-500"></span>
          </div>
        </footer>
      </div>
    </div>
  </div>

  <!-- Wiki 文档预览 -->
  <div id="wa-preview-root" class="pointer-events-none fixed inset-0 z-50 hidden">
    <div id="wa-preview-backdrop" class="pointer-events-auto flex h-full w-full items-center justify-center bg-slate-900/40 p-4 backdrop-blur-[1px]">
      <div id="wa-preview-panel" role="dialog" aria-modal="true" aria-labelledby="wa-preview-title" class="flex max-h-[90vh] w-full max-w-4xl flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xl">
        <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-5 py-4">
          <div class="min-w-0">
            <h3 id="wa-preview-title" class="truncate text-sm font-semibold text-slate-800">文档预览</h3>
            <p id="wa-preview-meta" class="mt-1 truncate font-mono text-[11px] text-slate-500"></p>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <button type="button" id="wa-preview-split" disabled class="rounded-lg border border-violet-200 bg-violet-50 px-3 py-1.5 text-xs font-medium text-violet-800 shadow-sm transition hover:bg-violet-100 disabled:cursor-not-allowed disabled:opacity-50">拆分故事</button>
            <button type="button" id="wa-preview-close" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 shadow-sm hover:bg-slate-50">关闭</button>
          </div>
        </div>
        <div id="wa-preview-body" class="min-h-0 flex-1 overflow-x-auto overflow-y-auto px-5 py-4 text-sm text-slate-800"></div>
      </div>
    </div>
  </div>

  <style>
    #wa-preview-body h1 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem; }
    #wa-preview-body h2 { font-size: 1.125rem; font-weight: 600; margin: 0.875rem 0 0.5rem; }
    #wa-preview-body h3 { font-size: 1rem; font-weight: 600; margin: 0.75rem 0 0.375rem; }
    #wa-preview-body p { margin: 0.5rem 0; line-height: 1.625; }
    #wa-preview-body ul, #wa-preview-body ol { margin: 0.5rem 0; padding-left: 1.25rem; }
    #wa-preview-body pre { margin: 0.75rem 0; overflow-x: auto; rounded: 0.5rem; background: #f1f5f9; padding: 0.75rem; font-size: 0.75rem; }
    #wa-preview-body code { font-size: 0.85em; background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 0.25rem; }
    #wa-preview-body table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.875rem; }
    #wa-preview-body th, #wa-preview-body td { border: 1px solid #e2e8f0; padding: 0.375rem 0.5rem; text-align: left; }
    #wa-preview-body th { background: #f8fafc; font-weight: 600; }
    #wa-story-ai-preview-body h1 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem; }
    #wa-story-ai-preview-body h2 { font-size: 1.125rem; font-weight: 600; margin: 0.875rem 0 0.5rem; }
    #wa-story-ai-preview-body h3 { font-size: 1rem; font-weight: 600; margin: 0.75rem 0 0.375rem; }
    #wa-story-ai-preview-body p { margin: 0.5rem 0; line-height: 1.625; }
    #wa-story-ai-preview-body ul, #wa-story-ai-preview-body ol { margin: 0.5rem 0; padding-left: 1.25rem; }
    #wa-story-ai-preview-body pre { margin: 0.75rem 0; overflow-x: auto; border-radius: 0.5rem; background: #f1f5f9; padding: 0.75rem; font-size: 0.75rem; }
    #wa-story-ai-preview-body code { font-size: 0.85em; background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 0.25rem; }
    #wa-story-ai-preview-body table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.875rem; }
    #wa-story-ai-preview-body th, #wa-story-ai-preview-body td { border: 1px solid #e2e8f0; padding: 0.375rem 0.5rem; text-align: left; }
    #wa-story-ai-preview-body th { background: #f8fafc; font-weight: 600; }
    .wa-card-accent-1 { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); }
    .wa-card-accent-2 { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); }
    .wa-card-accent-3 { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); }
    .wa-card-accent-4 { background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%); }
  </style>

  <script>
    (function () {
      var CATEGORIES = [
        { id: "1", label: "大陆清算" },
        { id: "2", label: "大陆资金" },
        { id: "3", label: "大陆账户" },
        { id: "4", label: "大陆支付" },
      ];

      /** 与后端 `WIKI_CODE_REPO_SLOT_COUNT` 一致 */
      var WIKI_CODE_REPO_SLOT_COUNT = 5;

      var WORKFLOW_TASK_TYPE_LABELS = {
        0: "设计",
        1: "开发",
        2: "开发规范优化",
        3: "测试预分析",
        4: "测试案例设计",
        5: "测试数据分析",
        6: "测试案例执行",
        7: "QA平台测试脚本生成",
        8: "Code Review",
        9: "拆分故事",
        10: "头脑风暴",
        101: "测试环境发布",
        102: "部署间隔等待",
        103: "测试环境发布结果",
      };

      var viewHome = document.getElementById("wa-view-home");
      var viewFiles = document.getElementById("wa-view-files");
      var viewStories = document.getElementById("wa-view-stories");
      var storiesTbody = document.getElementById("wa-stories-tbody");
      var storiesHeading = document.getElementById("wa-stories-heading");
      var storiesCountEl = document.getElementById("wa-stories-count");
      var storiesErrorEl = document.getElementById("wa-stories-error");
      var storiesLoadingEl = document.getElementById("wa-stories-loading");
      var storiesEmptyEl = document.getElementById("wa-stories-empty");
      var storyPickRoot = document.getElementById("wa-story-pick-root");
      var storyPickTitle = document.getElementById("wa-story-pick-title");
      var storyPickSub = document.getElementById("wa-story-pick-sub");
      var storyPickList = document.getElementById("wa-story-pick-list");
      var storyPickEmpty = document.getElementById("wa-story-pick-empty");
      var storyAiPreviewRoot = document.getElementById("wa-story-ai-preview-root");
      var storyAiPreviewTitle = document.getElementById("wa-story-ai-preview-title");
      var storyAiPreviewMeta = document.getElementById("wa-story-ai-preview-meta");
      var storyAiPreviewBody = document.getElementById("wa-story-ai-preview-body");
      var cardsEl = document.getElementById("wa-cards");
      var btnBack = document.getElementById("wa-btn-back");
      var titleEl = document.getElementById("wa-title");
      var subtitleEl = document.getElementById("wa-subtitle");
      var filesHeading = document.getElementById("wa-files-heading");
      var filesCountEl = document.getElementById("wa-files-count");
      var filesErrorEl = document.getElementById("wa-files-error");
      var filesLoadingEl = document.getElementById("wa-files-loading");
      var filesEmptyEl = document.getElementById("wa-files-empty");
      var filesListEl = document.getElementById("wa-files-list");
      var filesBreadcrumbEl = document.getElementById("wa-files-breadcrumb");
      var previewRoot = document.getElementById("wa-preview-root");
      var previewTitle = document.getElementById("wa-preview-title");
      var previewMeta = document.getElementById("wa-preview-meta");
      var previewBody = document.getElementById("wa-preview-body");
      var previewSplitBtn = document.getElementById("wa-preview-split");
      var sourceRoot = document.getElementById("wa-source-root");
      var sourceTitle = document.getElementById("wa-source-title");
      var sourceSub = document.getElementById("wa-source-sub");
      var sourceBody = document.getElementById("wa-source-body");
      var qaRoot = document.getElementById("wa-qa-root");
      var qaTitle = document.getElementById("wa-qa-title");
      var qaSub = document.getElementById("wa-qa-sub");
      var qaLog = document.getElementById("wa-qa-log");
      var qaInput = document.getElementById("wa-qa-input");
      var qaSendBtn = document.getElementById("wa-qa-send");
      var qaHint = document.getElementById("wa-qa-hint");
      var qaPrepRoot = document.getElementById("wa-qa-prep-root");
      var qaPrepSub = document.getElementById("wa-qa-prep-sub");
      var qaPrepConfluence = document.getElementById("wa-qa-prep-confluence");
      var qaPrepCodeList = document.getElementById("wa-qa-prep-code-list");
      var qaPrepError = document.getElementById("wa-qa-prep-error");
      var qaPrepStartBtn = document.getElementById("wa-qa-prep-start");

      var currentCategory = null;
      var currentDir = "";
      var previewCurrentDoc = null;
      var storyPickPid = "";
      var qaCategoryId = "";
      var qaThreadId = "";
      var qaStreamAbort = null;
      var qaStreaming = false;
      var qaPreparing = false;
      var qaPrepCategoryId = "";
      var qaPrepTriggerBtn = null;

      function renderQaPrepCodeCheckboxes(codeRepos) {
        if (!qaPrepCodeList) return;
        var html = "";
        for (var slot = 1; slot <= WIKI_CODE_REPO_SLOT_COUNT; slot++) {

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      function fmtTime(ms) {
        if (!ms) return "—";
        try {
          return new Date(ms).toLocaleString("zh-CN");
        } catch (e) {
          return String(ms);
        }
      }

      function fmtSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }

      function renderMarkdownHtml(md) {
        if (window.marked && typeof window.marked.parse === "function") {
          return window.marked.parse(String(md || ""));
        }
        return '<pre class="whitespace-pre-wrap font-mono text-xs">' + esc(md || "") + "</pre>";
      }

      function renderPlainTextHtml(text) {
        return '<pre class="whitespace-pre-wrap font-mono text-xs">' + esc(text || "") + "</pre>";
      }

      function renderJsonHtml(raw) {
        var text = String(raw || "");
        try {
          return renderPlainTextHtml(JSON.stringify(JSON.parse(text), null, 2));
        } catch (e) {
          return renderPlainTextHtml(text);
        }
      }

        var kind = doc && doc.content_kind ? doc.content_kind : "markdown";
        var content = doc && doc.content != null ? doc.content : "";
        if (kind === "json") return renderJsonHtml(content);
        if (kind === "text") return renderPlainTextHtml(content);
        return renderMarkdownHtml(content);

      function detectPreviewKindFromContent(content) {
        var t = String(content || "").trim();
        if (!t) return "text";
        if (t.charAt(0) === "{" || t.charAt(0) === "[") {
          try {
            JSON.parse(t);
            return "json";
          } catch (e) {
            /* continue */
          }
        }
        var signals = 0;
        var lines = t.split(/\r?\n/).slice(0, 80);
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          var s = line.trim();
          if (!s) continue;
          if (/^#{1,6}\s+\S/.test(s)) signals += 2;
          if (/^```/.test(s)) signals += 2;
          if (/^>\s+/.test(s)) signals += 1;
          if (/^\s*[-*+]\s+\S/.test(line)) signals += 1;
          if (/^\s*\d+\.\s+\S/.test(line)) signals += 1;
        }
        if (signals >= 2) return "markdown";
        return "text";
      }

      function submitSplitStory() {
        if (!previewCurrentDoc || !previewCurrentDoc.content) {
          window.alert("文档内容为空，无法拆分故事");
          return;
        }
        var creator = currentLoginUser();
        if (!creator) {
          window.alert("未获取到当前登录用户，请先通过管理台完成 Keycloak 登录");
          return;
        }
        var doc = previewCurrentDoc;
        var fileName = (doc.relative_path || "").split("/").pop() || "wiki-doc";
        var wikiPath = "wiki_base/" + doc.category_id + "/" + doc.relative_path;
        var confirmed = window.confirm(
          "确认将当前 Wiki 文档提交为业务 Agent（类型 4）父任务并拆分故事？\n\n" +
            "文档：" +
            fileName +
            "\n业务：" +
            categoryLabel(doc.category_id) +
            "\n创建人：" +
            creator,
        );
        if (!confirmed) return;

        previewSplitBtn.disabled = true;
        var prevText = previewSplitBtn.textContent;
        previewSplitBtn.textContent = "提交中…";

        fetch("/api/wiki-base/" + encodeURIComponent(doc.category_id) + "/sources")
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, status: r.status, body: j };
            });
          })
          .then(function (srcRes) {
            if (!srcRes.ok) {
              throw new Error("读取文档源配置失败 " + srcRes.status);
            }
            var codeRepo = srcRes.body && srcRes.body.code_repo ? srcRes.body.code_repo : null;
            var gitRemoteUrl = codeRepo && codeRepo.gitRemoteUrl ? String(codeRepo.gitRemoteUrl).trim() : "";
            var branch_version =
              codeRepo && codeRepo.branch_version
                ? String(codeRepo.branch_version).trim()
                : "master";
            if (!gitRemoteUrl) {
              throw new Error("请先在「文档源配置」中配置该业务的代码地址");
            }
            var body = {
              task_type: 4,
              provider: "claude",
              creator: creator,
              description: "Wiki拆分故事: " + wikiPath,
              requirement: String(doc.content),
              title: fileName.replace(/\.(md|markdown|txt|json)$/i, ""),
              gitRepos: [{ gitRemoteUrl: gitRemoteUrl, branch_version: branch_version }],
              testEnv: "wiki",
              params: [
                {
                  param_key: "wiki_doc",
                  value_json: {
                    category_id: doc.category_id,
                    category_label: categoryLabel(doc.category_id),
                    relative_path: doc.relative_path,
                    wiki_path: wikiPath,
                  },
                  description: "Wiki 文档来源",
                },
              ],
            };
            return fetch("/api/parent-tasks", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
          })
          .then(function (r) {
            if (!r) return null;
            return r.json().then(function (j) {
              return { ok: r.ok, status: r.status, body: j };
            });
          })
          .then(function (res) {
            previewSplitBtn.textContent = prevText;
            setPreviewSplitEnabled(true);
            if (!res) return;
            if (!res.ok) {
              var errMsg =
                res.body && res.body.error
                  ? typeof res.body.error === "string"
                    ? res.body.error
                    : JSON.stringify(res.body.error)
                  : JSON.stringify(res.body);
              window.alert("拆分故事提交失败 " + res.status + ": " + errMsg);
              return;
            }
            var pid =
              res.body && res.body.parent_task && res.body.parent_task.pid
                ? res.body.parent_task.pid
                : "";
            window.alert(pid ? "拆分故事已提交，父任务编号：" + pid : "拆分故事已提交");
          })
          .catch(function (e) {
            previewSplitBtn.textContent = prevText;
            setPreviewSplitEnabled(true);
            window.alert("拆分故事提交失败: " + e.message);
          });
      }

      function parseQaSseStream(response, onEvent) {
        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var buffer = "";
        function pump() {
          return reader.read().then(function (chunk) {
            if (chunk.done) return;
            buffer += decoder.decode(chunk.value, { stream: true });
            var sep;
            while ((sep = buffer.indexOf("\n\n")) !== -1) {
              var block = buffer.slice(0, sep);
              buffer = buffer.slice(sep + 2);
              var eventName = "message";
              var dataLines = [];
              block.split(/\r?\n/).forEach(function (line) {
                if (line.startsWith("event:")) eventName = line.slice(6).trim();
                else if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
              });
              var dataStr = dataLines.join("\n");
              if (!dataStr) continue;
              var payload;
              try {
                payload = JSON.parse(dataStr);
              } catch (e) {
                payload = dataStr;
              }
              onEvent(eventName, payload);
            }
            return pump();
          });
        }
        return pump();
      }

      function getSelectedQaPrepCodeRepoSlots() {
        var slots = [];
        if (!qaPrepCodeList) return slots;
        var boxes = qaPrepCodeList.querySelectorAll('input[type="checkbox"][data-slot]');
        for (var i = 0; i < boxes.length; i++) {
          var box = boxes[i];
          if (!box.checked) continue;
          var slot = parseInt(box.getAttribute("data-slot"), 10);
          if (slot >= 1 && slot <= WIKI_CODE_REPO_SLOT_COUNT) slots.push(slot);
        }
        return slots;
      }

      function startQaFromPrep() {
        var categoryId = qaPrepCategoryId;
        if (!categoryId || qaPreparing) return;

        var includeConfluence = !!qaPrepConfluence.checked;
        var includeCodeRepoSlots = getSelectedQaPrepCodeRepoSlots();
        if (!includeConfluence && includeCodeRepoSlots.length === 0) {
          setQaPrepError("请至少勾选一项");
          return;
        }

        var triggerBtn = qaPrepTriggerBtn;
        abortQaStream();
        qaPreparing = true;
        qaPrepStartBtn.disabled = true;
        qaPrepStartBtn.textContent = "准备中…";
        if (triggerBtn) {
          triggerBtn.disabled = true;
          triggerBtn.textContent = "准备中…";
        }
        setQaPrepError("");

        var creator = currentLoginUser();
        fetch("/api/wiki-base/" + encodeURIComponent(categoryId) + "/prepare-qa", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            include_confluence_docs: includeConfluence,
            include_code_repo_slots: includeCodeRepoSlots,
            creator: creator || undefined,
          }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, status: r.status, body: j };
            });
          })
          .then(function (res) {
            if (!res.ok) {
              setQaPrepError(res.body.error || "知识库准备失败 " + res.status);
              return;
            }
            closeQaPrepDialog();
            qaCategoryId = categoryId;
            qaThreadId = "";
            qaTitle.textContent = "智能问答 · " + categoryLabel(categoryId);
            var copied = res.body.copied != null ? res.body.copied : 0;
            var cloneStarted = !!res.body.clone_started;
            var parts = [];
            if (includeConfluence) {
              parts.push("Confluence 文档 " + copied + " 个");
            }
            if (cloneStarted) {
              parts.push("代码库后台克隆中");
            }
            qaSub.textContent =
              "task-repo/demo · " +
              (parts.length ? parts.join("、") : "工作区已就绪") +
              " · 关闭窗口将中断当前对话";
            if (window.ClaudeSseRender) window.ClaudeSseRender.clearLog(qaLog);
            else qaLog.innerHTML = "";
            qaInput.value = "";
            var hasContext = (includeConfluence && copied > 0) || cloneStarted;
            setQaHint(
              hasContext
                ? cloneStarted
                  ? "代码库正在后台克隆，问答时可能尚未就绪"
                  : ""
                : "未载入文档或代码，回答可能缺少业务上下文",
              hasContext ? "" : "error",
            );
            setQaStreaming(false);
            qaRoot.classList.remove("hidden");
            document.body.style.overflow = "hidden";
            qaInput.focus();
          })
          .catch(function (e) {
            setQaPrepError("知识库准备失败: " + (e.message || String(e)));
          })
          .finally(function () {
            qaPreparing = false;
            qaPrepStartBtn.disabled = false;
            qaPrepStartBtn.textContent = "开始问答";
            if (triggerBtn) {
              triggerBtn.disabled = false;
              triggerBtn.textContent = "智能问答";
            }
          });
      }

      function sendQaMessage() {
        var prompt = qaInput.value.trim();
        if (!prompt) {
          setQaHint("请先输入问题", "error");
          return;
        }
        if (qaStreaming) return;

        appendQaUserMessage(prompt);
        qaInput.value = "";
        setQaHint("回答生成中…");
        setQaStreaming(true);

        var ac = new AbortController();
        qaStreamAbort = ac;
        var body = { prompt: prompt };
        if (qaThreadId) body.threadId = qaThreadId;

        fetch(waBase() + "/api/agents/claude/sse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          signal: ac.signal,
        })
          .then(function (r) {
            if (!r.ok) {
              return r.text().then(function (t) {
                throw new Error("HTTP " + r.status + (t ? ": " + t : ""));
              });
            }
            return parseQaSseStream(r, function (eventName, payload) {
              if (payload && payload.type === "meta" && payload.threadId) {
                qaThreadId = payload.threadId;
              }
              if (window.ClaudeSseRender) {
                window.ClaudeSseRender.appendEvent(qaLog, eventName, payload);
              }
            });
          })
          .then(function () {
            if (qaStreamAbort === ac) setQaHint("");
          })
          .catch(function (e) {
            if (e && e.name === "AbortError") {
              if (window.ClaudeSseRender) {
                window.ClaudeSseRender.appendSystemLine(qaLog, "— 对话已中断 —", "error");
              }
              setQaHint("对话已中断");
              return;
            }
            if (window.ClaudeSseRender) {
              window.ClaudeSseRender.appendSystemLine(qaLog, e.message || String(e), "error");
            }
            setQaHint(e.message || String(e), "error");
          })
          .finally(function () {
            if (qaStreamAbort === ac) {
              qaStreamAbort = null;
              setQaStreaming(false);
            }
          });
      }

      function formatSyncResult(body) {
        var lines = [];
        (body.sources || []).forEach(function (s) {
          if (s.skipped) {
            lines.push(s.source_type_label + "：跳过（" + (s.skip_reason || "未配置") + "）");
            return;
          }
          var errPart = s.failed > 0 ? "，失败 " + s.failed + " 页" : "";
          lines.push(
            s.source_type_label +
              "：成功 " +
              s.saved +
              "/" +
              s.total +
              " 页 → " +
              s.output_dir +
              errPart,
          );
        });
        return lines.join("\n");
      }

          return;

        var dirBtn = e.target && e.target.closest && e.target.closest(".wa-dir-btn");
        if (dirBtn && currentCategory) {
          var subDir = dirBtn.getAttribute("data-dir");
          if (subDir !== null && subDir !== undefined) showFiles(currentCategory, subDir);
          return;
        }
        var btn = e.target && e.target.closest && e.target.closest(".wa-file-btn");
        if (!btn || !currentCategory) return;
        var path = btn.getAttribute("data-path");
        if (path) openPreview(currentCategory, path);
      });

      filesBreadcrumbEl.addEventListener("click", function (e) {
        var crumb = e.target && e.target.closest && e.target.closest(".wa-dir-crumb");
        if (!crumb || !currentCategory) return;
        var targetDir = crumb.getAttribute("data-dir");
        if (targetDir !== null && targetDir !== undefined) showFiles(currentCategory, targetDir);
      });

      storiesTbody.addEventListener("click", function (e) {
        var flowBtn = e.target && e.target.closest && e.target.closest(".wa-story-flow-btn");
        if (flowBtn) {
          var flowPid = flowBtn.getAttribute("data-pid");
          if (flowPid) openParentFlowInNewTab(flowPid);
          return;
        }
        var previewBtn = e.target && e.target.closest && e.target.closest(".wa-story-preview-btn");
        if (previewBtn) {
          var previewPid = previewBtn.getAttribute("data-pid");
          if (previewPid) openStoryPreviewPicker(previewPid, previewBtn);
        }
      });

      storyPickList.addEventListener("click", function (e) {
        var opt = e.target && e.target.closest && e.target.closest(".wa-story-pick-opt");
        if (!opt || !storyPickPid) return;
        var taskType = opt.getAttribute("data-task-type");
        if (taskType !== null && taskType !== "") loadStoryAiPreviewDoc(storyPickPid, taskType);
      });

      btnBack.addEventListener("click", function () {
        if (!viewFiles.classList.contains("hidden") && currentCategory && currentDir) {
          var parent = currentDir.split("/").slice(0, -1).join("/");
          showFiles(currentCategory, parent);
          return;
        }
        showHome();
      });
      document.getElementById("wa-story-pick-close").addEventListener("click", closeStoryPick);
      document.getElementById("wa-story-pick-backdrop").addEventListener("click", function (e) {
        if (e.target.id === "wa-story-pick-backdrop") closeStoryPick();
      });
      document.getElementById("wa-story-pick-panel").addEventListener("click", function (e) {
        e.stopPropagation();
      });
      document.getElementById("wa-story-ai-preview-close").addEventListener("click", closeStoryAiPreview);
      document.getElementById("wa-story-ai-preview-backdrop").addEventListener("click", function (e) {
        if (e.target.id === "wa-story-ai-preview-backdrop") closeStoryAiPreview();
      });
      document.getElementById("wa-story-ai-preview-panel").addEventListener("click", function (e) {
        e.stopPropagation();
      });
      document.getElementById("wa-source-close").addEventListener("click", closeSourceConfig);
      document.getElementById("wa-source-backdrop").addEventListener("click", function (e) {
        if (e.target.id === "wa-source-backdrop") closeSourceConfig();
      });
      document.getElementById("wa-source-panel").addEventListener("click", function (e) {
        e.stopPropagation();
      });
      document.getElementById("wa-qa-prep-close").addEventListener("click", closeQaPrepDialog);
      document.getElementById("wa-qa-prep-cancel").addEventListener("click", closeQaPrepDialog);
      document.getElementById("wa-qa-prep-start").addEventListener("click", startQaFromPrep);
      document.getElementById("wa-qa-prep-backdrop").addEventListener("click", function (e) {
        if (e.target.id === "wa-qa-prep-backdrop") closeQaPrepDialog();
      });
      document.getElementById("wa-qa-prep-panel").addEventListener("click", function (e) {
        e.stopPropagation();
      });
      document.getElementById("wa-qa-close").addEventListener("click", closeQaChat);
      document.getElementById("wa-qa-backdrop").addEventListener("click", function (e) {
        if (e.target.id === "wa-qa-backdrop") closeQaChat();
      });
      document.getElementById("wa-qa-panel").addEventListener("click", function (e) {
        e.stopPropagation();
      });
      qaSendBtn.addEventListener("click", sendQaMessage);
      qaInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendQaMessage();
        }
      });
      previewSplitBtn.addEventListener("click", submitSplitStory);
      document.getElementById("wa-preview-close").addEventListener("click", closePreview);
      document.getElementById("wa-preview-backdrop").addEventListener("click", function (e) {
        if (e.target.id === "wa-preview-backdrop") closePreview();
      });
      document.getElementById("wa-preview-panel").addEventListener("click", function (e) {
        e.stopPropagation();
      });

      showHome();
    })();
  </script>
</body>
</html>
