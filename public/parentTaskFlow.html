<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>父任务工作流 — 子任务与 Claude SSE</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="/js/accessUser.js"></script>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-slate-50 text-slate-900 antialiased">
  <header class="flex shrink-0 flex-wrap items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3 shadow-sm sm:px-5">
    <div class="min-w-0">
      <h1 class="text-sm font-semibold text-slate-800">‌Multi-Agent‌任务工作流</h1>
      <p id="ptf-sub" class="mt-0.5 truncate font-mono text-xs text-slate-500"></p>
      <p id="ptf-err" class="mt-1 hidden text-xs text-red-600"></p>
    </div>
    <div class="flex shrink-0 flex-wrap items-center gap-2">
      <label class="sr-only" for="ptf-pid-input">父任务 pid</label>
      <input
        id="ptf-pid-input"
        type="text"
        maxlength="200"
        placeholder="pid"
        class="w-36 rounded-lg border border-slate-200 bg-white px-2 py-1.5 font-mono text-xs text-slate-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/25 sm:w-48"
      />
      <button
        type="button"
        id="ptf-load"
        class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-700"
      >
        加载
      </button>
      <button
        type="button"
        id="ptf-close"
        class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50"
      >
        关闭窗口
      </button>
    </div>
  </header>

  <div class="flex min-h-0 flex-1 flex-col">
    <aside id="ptf-aside" class="flex min-h-0 flex-1 flex-col bg-white">
      <div class="shrink-0 border-b border-slate-100 bg-slate-50/80 px-4 py-2 sm:px-5">
        <p id="ptf-parent-title" class="text-xs font-medium text-slate-700">—</p>
        <p id="ptf-summary" class="mt-0.5 text-[11px] text-slate-500"></p>
      </div>
      <div id="ptf-flow" class="min-h-0 flex-1 overflow-y-auto p-4 text-sm sm:p-5" role="navigation" aria-label="工作流子任务">
        <p class="text-center text-xs text-slate-400">请输入 pid 并点击「加载」</p>
      </div>
    </aside>
  </div>

  <div id="ptf-expand-root" class="pointer-events-none fixed inset-0 z-50 hidden">
    <div
      id="ptf-expand-backdrop"
      class="pointer-events-auto flex h-full w-full flex-col bg-slate-900/55 p-2 sm:p-3"
    >
      <div
        id="ptf-expand-panel"
        class="flex w-full flex-col overflow-hidden rounded-lg border border-slate-200 bg-white shadow-2xl sm:rounded-xl"
        role="dialog"
        aria-modal="true"
        aria-labelledby="ptf-expand-title"
      >
        <div
          id="ptf-expand-resize-handle"
          class="ptf-expand-resize-handle"
          title="拖动调整高度"
          aria-label="拖动调整高度"
        >
          <span class="ptf-expand-resize-grip" aria-hidden="true"></span>
        </div>
        <div class="flex shrink-0 items-center justify-between gap-3 border-b border-slate-200 px-4 py-3">
          <h2 id="ptf-expand-title" class="min-w-0 truncate text-sm font-semibold text-slate-800">任务 SSE</h2>
          <div class="flex shrink-0 items-center gap-2">
            <span id="ptf-expand-stop-hint" class="hidden max-w-[12rem] truncate text-[11px] text-slate-500"></span>
            <button
              type="button"
              id="ptf-expand-stop"
              class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-1.5 text-xs font-medium text-amber-900 hover:bg-amber-100 disabled:cursor-not-allowed disabled:opacity-50"
              disabled
            >
              停止
            </button>
            <button
              type="button"
              id="ptf-expand-close"
              class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50"
            >
              关闭
            </button>
          </div>
        </div>
        <iframe
          id="ptf-expand-iframe"
          class="block min-h-0 w-full flex-1 border-0 bg-white"
          title="任务 SSE 放大"
        ></iframe>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var subEl = document.getElementById("ptf-sub");
      var errEl = document.getElementById("ptf-err");
      var flowEl = document.getElementById("ptf-flow");
      var parentTitleEl = document.getElementById("ptf-parent-title");
      var summaryEl = document.getElementById("ptf-summary");
      var pidInput = document.getElementById("ptf-pid-input");

      var TASK_STATUS_PENDING = 1;
      var TASK_STATUS_RUNNING = 2;
      var TASK_STATUS = {
        1: "待执行",
        2: "执行中",
        3: "执行完成",
        4: "执行失败",
        5: "已暂停",
        6: "已取消",
      };
      var SUBTASK_STATUS = {
        1: "待执行",
        2: "执行中",
        3: "执行完成",
        4: "执行失败",
        5: "已跳过",
        6: "已取消",
      };
      var TASK_TYPE = {
        0: "设计",
        1: "开发",
        2: "开发规范优化",
        3: "测试预分析",
        4: "测试案例设计",
        5: "测试数据分析",
        6: "测试案例执行",
        7: "QA平台测试脚本生成",
        8: "Code Review",
        9: "拆分故事",
        10: "头脑风暴",
        11: "AI拆分故事",
        12: "UI测试执行",
        13: "生成业务知识",
        14: "生成代码规范",
        15: "生成测试规范",
        20: "功能测试用例生成",
        21: "自动化用例生成",
        22: "测试脑图分析",
        101: "测试环境发布",
        102: "部署间隔等待",
        103: "测试环境发布结果",
        104: "申请拉取分支",
      };
      var MARVIS_IMG = "/img/Marvis.png";

      function queryParams() {
        return new URLSearchParams(window.location.search);
      }

      function apiBase() {
        var b = queryParams().get("base");
        if (b && String(b).trim()) return String(b).trim().replace(/\/$/, "");
        return window.location.origin;
      }

      function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.remove("hidden");
      }

      function clearError() {
        errEl.textContent = "";
        errEl.classList.add("hidden");
      }

      function esc(s) {
        if (s == null) return "";
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      /** 任务/子任务状态对应 Tailwind 色类（节点标签与状态徽章共用） */
      function statusColorClass(code) {
        var cls = "bg-slate-100 text-slate-700";
        if (code === 2) cls = "bg-blue-100 text-blue-800";
        else if (code === 3) cls = "bg-emerald-100 text-emerald-800";
        else if (code === 4) cls = "bg-red-100 text-red-800";
        else if (code === 5) cls = "bg-amber-100 text-amber-900";
        else if (code === 6) cls = "bg-slate-200 text-slate-600";
        return cls;
      }

      function statusBadge(label, code) {
        return (
          '<span class="inline-flex rounded px-1.5 py-0.5 text-[10px] font-medium ' +
          statusColorClass(code) +
          '">' +
          esc(label) +
          "</span>"
        );
      }

      function nodeLabelBadge(label, code) {
        return (
          '<span class="shrink-0 rounded px-1.5 py-0.5 text-[10px] font-semibold leading-none ' +
          statusColorClass(code) +
          '" title="' +
          esc(label) +
          '">' +
          esc(label) +
          "</span>"
        );
      }

      /** 从父任务 `param_key=init` 解析 Agent 线路 */
      function initProviderFromParams(taskParams) {
        var row = (taskParams || []).find(function (p) {
          return p && p.param_key === "init";
        });
        if (!row || !row.value_json) return "claude";
        try {
          var o = JSON.parse(row.value_json);
          return o && o.provider === "cursor" ? "cursor" : "claude";
        } catch (e) {
          return "claude";
        }
      }

      /** 构建单任务 SSE 页 URL；`provider` 来自已加载的父任务参数，SSE 页可免二次请求 */
      function taskStreamUrl(taskId, pid, provider) {
        var pageOrigin = window.location.origin;
        var prov = provider === "cursor" ? "cursor" : "claude";
        var u =
          pageOrigin +
          "/agent-dev/task-stream?taskId=" +
          encodeURIComponent(taskId) +
          "&pid=" +
          encodeURIComponent(pid) +
          "&provider=" +
          encodeURIComponent(prov);
        var base = apiBase();
        if (base && base !== pageOrigin) {
          u += "&base=" + encodeURIComponent(base);
        }
        u += "&embed=1";
        return u;
      }

      var loadedPid = "";
      var expandRoot = document.getElementById("ptf-expand-root");
      var expandBackdrop = document.getElementById("ptf-expand-backdrop");
      var expandPanel = document.getElementById("ptf-expand-panel");
      var expandResizeHandle = document.getElementById("ptf-expand-resize-handle");
      var expandTitle = document.getElementById("ptf-expand-title");
      var expandIframe = document.getElementById("ptf-expand-iframe");
      var expandStopBtn = document.getElementById("ptf-expand-stop");
      var expandStopHint = document.getElementById("ptf-expand-stop-hint");
      var expandCurrentTaskId = "";
      var PTF_EXPAND_MIN_H = 180;
      var PTF_EXPAND_MAX_RATIO = 0.95;
      var expandResizeDrag = null;

      function getExpandMaxHeight() {
        return Math.floor(window.innerHeight * PTF_EXPAND_MAX_RATIO);
      }

      function clearExpandPanelHeight() {
        if (!expandPanel) return;
        expandPanel.style.height = "";
        expandPanel.style.maxHeight = "";
      }

      function setExpandPanelHeight(px) {
        if (!expandPanel) return;
        var h = Math.max(PTF_EXPAND_MIN_H, Math.min(px, getExpandMaxHeight()));
        expandPanel.style.height = h + "px";
        expandPanel.style.maxHeight = h + "px";
        if (expandRoot) expandRoot.classList.add("ptf-expand--resized");
      }

      function resetExpandPanelLayout() {
        if (expandRoot) expandRoot.classList.remove("ptf-expand--resized");
        clearExpandPanelHeight();
      }

      function stopExpandResize() {
        expandResizeDrag = null;
        document.removeEventListener("mousemove", onExpandResizeMove);
        document.removeEventListener("mouseup", stopExpandResize);
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
      }

      function onExpandResizeMove(e) {
        if (!expandResizeDrag || !expandPanel) return;
        var deltaY = expandResizeDrag.startY - e.clientY;
        setExpandPanelHeight(expandResizeDrag.startHeight + deltaY);
      }

      function setExpandStopHint(text, tone) {
        if (!expandStopHint) return;
        if (!text) {
          expandStopHint.textContent = "";
          expandStopHint.classList.add("hidden");
          expandStopHint.classList.remove("text-slate-500", "text-green-600", "text-red-600");
          return;
        }
        expandStopHint.textContent = text;
        expandStopHint.classList.remove("hidden", "text-slate-500", "text-green-600", "text-red-600");
        if (tone === "success") expandStopHint.classList.add("text-green-600");
        else if (tone === "error") expandStopHint.classList.add("text-red-600");
        else expandStopHint.classList.add("text-slate-500");
      }

      function setExpandStopEnabled(on) {
        if (expandStopBtn) expandStopBtn.disabled = !on;
      }

      function requestExpandAgentAbort() {
        if (!expandCurrentTaskId) return;
        setExpandStopEnabled(false);
        setExpandStopHint("正在停止 Agent…", "default");
        fetch(apiBase() + "/api/tasks/" + encodeURIComponent(expandCurrentTaskId) + "/agent-abort", {
          method: "POST",
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, status: r.status, body: j };
            });
          })
          .then(function (res) {
            if (res.ok && res.body && res.body.ok) {
              setExpandStopHint("已发送停止请求，等待结束…", "success");
              return;
            }
            var msg =
              res.body && res.body.error
                ? typeof res.body.error === "string"
                  ? res.body.error
                  : JSON.stringify(res.body.error)
                : "停止失败 HTTP " + res.status;
            setExpandStopHint(msg, "error");
            setExpandStopEnabled(true);
          })
          .catch(function (e) {
            setExpandStopHint("停止请求失败: " + e.message, "error");
            setExpandStopEnabled(true);
          });
      }

      function closeExpandModal() {
        if (!expandRoot) return;
        stopExpandResize();
        expandRoot.classList.add("hidden");
        expandRoot.classList.remove("ptf-expand--half", "ptf-expand--full", "ptf-expand--resized");
        clearExpandPanelHeight();
        expandCurrentTaskId = "";
        setExpandStopEnabled(false);
        setExpandStopHint("");
        if (expandIframe) expandIframe.removeAttribute("src");
      }

      /** 放大视图：为 SSE 页追加 wide=1，解除对话气泡最大宽度限制 */
      function streamUrlForExpand(src) {
        try {
          var u = new URL(src, window.location.href);
          u.searchParams.set("wide", "1");
          return u.pathname + u.search;
        } catch (e) {
          return src + (src.indexOf("?") >= 0 ? "&" : "?") + "wide=1";
        }
      }

      /** half=false 对话 点击传 true 全屏 */
      function setExpandLayout(fullHeight) {
        if (!expandRoot) return;
        resetExpandPanelLayout();
        expandRoot.classList.remove("ptf-expand--half", "ptf-expand--full");
        expandRoot.classList.add(fullHeight ? "ptf-expand--full" : "ptf-expand--half");
      }

      /** 放大弹窗加载 SSE（卡片内不嵌 iframe） */
      function openExpandModal(article, fullHeight) {
        if (!expandRoot || !expandIframe || !article) return;
        var src = article.getAttribute("data-stream-src");
        if (!src) return;
        var taskId = article.getAttribute("data-task-id") || "";
        expandCurrentTaskId = taskId;
        setExpandStopEnabled(!!taskId);
        setExpandStopHint("");
        var expandSrc = streamUrlForExpand(src);
        var titleEl = article.querySelector(".ptf-stage-title");
        if (expandTitle) {
          expandTitle.textContent = titleEl ? titleEl.textContent : "任务 SSE";
        }
        if (expandIframe.getAttribute("src") !== expandSrc) {
          expandIframe.setAttribute("src", expandSrc);
        }
        expandIframe.setAttribute(
          "title",
          titleEl ? titleEl.textContent : "任务 SSE"
        );
        setExpandLayout(fullHeight === true);
        expandRoot.classList.remove("hidden");
      }

      function resetTaskToPending(taskId, triggerBtn) {
        if (!taskId) return;
        if (
          !window.confirm(
            "确定将该任务重置为「待执行」？将清除本轮执行结果，由调度器重新认领。"
          )
        ) {
          return;
        }
        if (triggerBtn) {
          triggerBtn.disabled = true;
          triggerBtn.textContent = "处理中…";
        }
        fetch(apiBase() + "/api/tasks/" + encodeURIComponent(taskId), {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: TASK_STATUS_PENDING }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, status: r.status, body: j };
            });
          })
          .then(function (res) {
            if (triggerBtn) {
              triggerBtn.disabled = false;
              triggerBtn.textContent = "重新执行";
            }
            if (!res.ok) {
              showError(
                "重置失败 " +
                  res.status +
                  ": " +
                  (res.body && res.body.error
                    ? JSON.stringify(res.body.error)
                    : JSON.stringify(res.body))
              );
              return;
            }
            clearError();
            if (loadedPid) {
              loadParent(loadedPid);
            }
          })
          .catch(function (e) {
            if (triggerBtn) {
              triggerBtn.disabled = false;
              triggerBtn.textContent = "重新执行";
            }
            showError("重置失败: " + e.message);
          });
      }

      function taskStatusCode(status) {
        return Number(status);
      }

      /** 按 taskId 查找流水线阶段卡片（避免误选顶部进度轨 button） */
      function findStageArticle(taskId) {
        if (!taskId || !flowEl) return null;
        return flowEl.querySelector(
          'article.ptf-pipeline-stage[data-task-id="' + taskId + '"]'
        );
      }

      function scrollToTask(taskId) {
        if (!taskId) return;
        var el = findStageArticle(taskId);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
          el.classList.add("ring-2", "ring-blue-400");
          setTimeout(function () {
            el.classList.remove("ring-2", "ring-blue-400");
          }, 2000);
        }
      }

      /** 流水线节点/连线状态（由任务 status 映射） */
      function pipelineVisual(status) {
        var code = taskStatusCode(status);
        if (code === 2) return "active";
        if (code === 3) return "done";
        if (code === 4) return "failed";
        return "pending";
      }

      /** 节点间连线：前一节点已完成则高亮 */
      function pipelineSegVisual(fromStatus) {
        var code = taskStatusCode(fromStatus);
        if (code === 3) return "done";
        if (code === 2) return "active";
        if (code === 4) return "failed";
        return "pending";
      }

      function pipelineConnectorSvg() {
        return (
          '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
          '<path d="M4 12h14M14 7l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
          "</svg>"
        );
      }

      /** 进度轨：每种 task_type 全局只展示一次，同类型多节点合并并统计次数 */
      function buildRailGroups(list) {
        var groups = [];
        var groupByType = {};
        list.forEach(function (t, ti) {
          var typeKey = String(t.task_type);
          var existing = groupByType[typeKey];
          if (existing) {
            existing.tasks.push(t);
            existing.indices.push(ti);
          } else {
            var g = {
              task_type: t.task_type,
              tasks: [t],
              indices: [ti],
            };
            groupByType[typeKey] = g;
            groups.push(g);
          }
        });
        return groups;
      }

      /** 连线状态：取当前类型组在下一类型首次出现之前的最后一个节点 */
      function railSegVisualAfterGroup(group, nextGroup, list) {
        if (!nextGroup) {
          var lastTask = group.tasks[group.tasks.length - 1];
          return pipelineSegVisual(lastTask.status);
        }
        var nextFirstIdx = nextGroup.indices[0];
        var bridgeIdx = -1;
        group.indices.forEach(function (i) {
          if (i < nextFirstIdx && i > bridgeIdx) bridgeIdx = i;
        });
        if (bridgeIdx < 0) {
          return pipelineSegVisual(group.tasks[0].status);
        }
        return pipelineSegVisual(list[bridgeIdx].status);
      }

      /** 合并组内状态：有执行中优先，否则全完成 / 有失败 / 待执行 */
      function railGroupVisual(group) {
        var hasActive = false;
        var hasFailed = false;
        var allDone = true;
        group.tasks.forEach(function (t) {
          var code = taskStatusCode(t.status);
          if (code === TASK_STATUS_RUNNING) hasActive = true;
          if (code === 4) hasFailed = true;
          if (code !== 3) allDone = false;
        });
        if (hasActive) return "active";
        if (allDone) return "done";
        if (hasFailed) return "failed";
        return "pending";
      }

      /** 点击进度轨节点时定位到组内最相关任务 */
      function primaryTaskIdInGroup(group) {
        var running = group.tasks.find(function (t) {
          return taskStatusCode(t.status) === TASK_STATUS_RUNNING;
        });
        if (running) return running.id;
        var pending = group.tasks.find(function (t) {
          return taskStatusCode(t.status) === TASK_STATUS_PENDING;
        });
        if (pending) return pending.id;
        return group.tasks[0].id;
      }

      function railGroupTitle(group) {
        var typeLabel = TASK_TYPE[group.task_type] || String(group.task_type);
        var nodeLabels = group.indices.map(function (i) {
          return "节点" + (i + 1);
        });
        var title = nodeLabels.join("、") + " · " + typeLabel;
        if (group.tasks.length > 1) {
          title += " · loop × " + group.tasks.length;
        }
        return title;
      }

      function renderFlow(data) {
        var pt = data.parent_task;
        var list = data.tasks_with_subtasks || [];
        parentTitleEl.textContent = pt.title || pt.pid;
        var subCount = 0;
        list.forEach(function (t) {
          subCount += (t.subtasks || []).length;
        });
        summaryEl.textContent =
          "pid: " +
          pt.pid +
          " · 流水线 " +
          list.length +
          " 个节点 · " +
          /*      "子任务 " +
          subCount +
          " 个 · " +*/
                "点击「对话」加载 SSE";

        if (list.length === 0) {
          flowEl.innerHTML =
            '<p class="text-center text-xs text-slate-500">该父任务下暂无工作流任务（tasks）</p>';
          return;
        }

        var parentProvider = initProviderFromParams(data.parent_task_params);
        var preselectTaskId = (queryParams().get("taskId") || "").trim();
        var html = '<div class="ptf-pipeline-wrap">';

        /* 顶部进度轨：按任务类型合并展示，重复类型标注 loop × n */
        var railGroups = buildRailGroups(list);
        html += '<div class="ptf-pipeline-rail" aria-label="流水线进度">';
        html += '<div class="ptf-pipeline-rail-inner">';
        railGroups.forEach(function (group, gi) {
          var typeLabel = TASK_TYPE[group.task_type] || String(group.task_type);
          var visual = railGroupVisual(group);
          var primaryTaskId = primaryTaskIdInGroup(group);
          var loopCount = group.tasks.length;
          html +=
            '<button type="button" class="ptf-pipeline-rail-node" data-task-id="' +
            esc(primaryTaskId) +
            '" title="' +
            esc(railGroupTitle(group)) +
            '">';
          html += '<span class="ptf-pipeline-rail-loop-slot" aria-hidden="true">';
          if (loopCount > 1) {
            html +=
              '<span class="ptf-pipeline-rail-loop">loop × ' +
              String(loopCount) +
              "</span>";
          }
          html += "</span>";
          html +=
            '<span class="ptf-pipeline-rail-dot ptf-pipeline-rail-dot--' +
            visual +
            '">' +
            String(gi + 1) +
            "</span>";
          html +=
            '<span class="ptf-pipeline-rail-label">' + esc(typeLabel) + "</span>";
          html += "</button>";
          if (gi < railGroups.length - 1) {
            var segVisual = railSegVisualAfterGroup(
              group,
              railGroups[gi + 1],
              list
            );
            html +=
              '<span class="ptf-pipeline-rail-seg ptf-pipeline-rail-seg--' +
              segVisual +
              '" aria-hidden="true"></span>';
          }
        });
        html += "</div></div>";

        /* 横向流水线：阶段卡片 + 箭头连接 */
        html += '<div class="ptf-pipeline-track">';
        html += '<div class="ptf-pipeline-track-inner">';
        list.forEach(function (t, ti) {
          var nodeLabel = "节点" + (ti + 1);
          var typeLabel = TASK_TYPE[t.task_type] || String(t.task_type);
          var stLabel = TASK_STATUS[t.status] || String(t.status);
          var visual = pipelineVisual(t.status);
          var streamSrc = taskStreamUrl(t.id, pt.pid, parentProvider);
          html +=
            '<article class="ptf-pipeline-stage ptf-pipeline-stage--' +
            visual +
            '" data-task-id="' +
            esc(t.id) +
            '" data-stream-src="' +
            esc(streamSrc) +
            '">';
          html +=
            '<div class="flex shrink-0 flex-col gap-1.5 border-b border-slate-100 bg-white px-2 py-1.5">';
          html += '<div class="flex min-w-0 items-start gap-1.5">';
          html += nodeLabelBadge(nodeLabel, t.status);
          html +=
            '<img src="' +
            esc(MARVIS_IMG) +
            '" alt="" class="shrink-0 object-contain" style="width:24px;height:24px" width="24" height="24" />';
          html += '<div class="min-w-0 flex-1">';
          html +=
            '<p class="ptf-stage-title line-clamp-2 text-[11px] font-semibold leading-snug text-slate-800" title="' +
            esc(typeLabel + " · " + (t.title || "（无标题）")) +
            '">' +
            esc(typeLabel) +
            "</p>";
          html +=
            '<p class="mt-0.5 flex min-w-0 flex-wrap items-center gap-1">';
          html += statusBadge(stLabel, t.status);
          html += "</p>";
          html += "</div></div>";
          html +=
            '<p class="truncate font-mono text-[9px] text-slate-400" title="' +
            esc(t.id) +
            '">' +
            esc(t.id) +
            "</p>";
          html +=
            '<div class="flex gap-1">';
          html +=
            '<button type="button" class="ptf-expand-btn flex-1 whitespace-nowrap rounded bg-blue-600 px-2 py-1 text-[10px] font-medium text-white hover:bg-blue-700" data-task-id="' +
            esc(t.id) +
            '">对话</button>';// 放大按钮
          html +=
            '<button type="button" class="ptf-reexec-btn whitespace-nowrap rounded border border-amber-200 bg-amber-50 px-1.5 py-1 text-[10px] font-medium text-amber-900 hover:bg-amber-100 disabled:opacity-50" data-task-id="' +
            esc(t.id) +
            '">重跑</button>';
          html += "</div></div>";
          html += '<ol class="max-h-20 shrink-0 list-none overflow-y-auto px-2 py-1">';
          var subs = t.subtasks || [];
          if (subs.length === 0) {
            // 无子任务时不占位
          } else {
            subs.forEach(function (s, si) {
              var sLabel = SUBTASK_STATUS[s.status] || String(s.status);
              html +=
                '<li class="flex gap-1.5 border-l-2 border-slate-200 py-1 pl-2 pr-0.5' +
                (si < subs.length - 1 ? " mb-0.5" : "") +
                '">';
              html +=
                '<span class="shrink-0 font-mono text-[9px] text-slate-400">' +
                String(s.sort_order != null ? s.sort_order : si + 1) +
                "</span>";
              html += '<div class="min-w-0 flex-1">';
              html +=
                '<p class="line-clamp-1 text-[10px] text-slate-800">' +
                esc(s.title || "步骤 " + (si + 1)) +
                "</p>";
              html +=
                '<p class="mt-0.5 flex flex-wrap items-center gap-1 text-[9px] text-slate-500">';
              html += statusBadge(sLabel, s.status);
              if (s.kind) {
                html +=
                  '<span class="rounded bg-slate-100 px-1 text-slate-600">' +
                  esc(s.kind) +
                  "</span>";
              }
              if (s.error_message) {
                html +=
                  '<span class="text-red-600" title="' +
                  esc(s.error_message) +
                  '">错误</span>';
              }
              html += "</p>";
              if (s.out_file_path) {
                html +=
                  '<p class="mt-0.5 truncate font-mono text-[9px] text-slate-400" title="' +
                  esc(s.out_file_path) +
                  '">out: ' +
                  esc(s.out_file_path) +
                  "</p>";
              }
              html += "</div></li>";
            });
          }
          html += "</ol>";
          html += "</article>";

          if (ti < list.length - 1) {
            var connVisual = pipelineSegVisual(t.status);
            html +=
              '<div class="ptf-pipeline-connector ptf-pipeline-connector--' +
              connVisual +
              '" aria-hidden="true">' +
              pipelineConnectorSvg() +
              "</div>";
          }
        });
        html += "</div></div></div>";
        flowEl.innerHTML = html;

        /* 默认打开执行中任务 SSE；URL taskId 优先（若该任务正在执行） */
        var openTaskId = "";
        if (preselectTaskId) {
          var preselectTask = list.find(function (t) {
            return t.id === preselectTaskId;
          });
          if (preselectTask && taskStatusCode(preselectTask.status) === TASK_STATUS_RUNNING) {
            openTaskId = preselectTaskId;
          }
        }
        if (!openTaskId) {
          var runningTask = list.find(function (t) {
            return taskStatusCode(t.status) === TASK_STATUS_RUNNING;
          });
          if (runningTask) openTaskId = runningTask.id;
        }
        if (openTaskId) {
          scrollToTask(openTaskId);
          var openArticle = findStageArticle(openTaskId);
          if (openArticle) openExpandModal(openArticle, false);
        } else if (preselectTaskId) {
          scrollToTask(preselectTaskId);
        }
      }

      function loadParent(pid) {
        clearError();
        if (!pid) {
          showError("请填写父任务 pid。");
          return;
        }
        pidInput.value = pid;
        subEl.textContent = "pid " + pid;
        var url =
          apiBase() + "/api/parent-tasks?pid=" + encodeURIComponent(pid);
        flowEl.innerHTML =
          '<p class="text-center text-xs text-slate-400">加载中…</p>';
        fetch(url)
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, status: r.status, body: j };
            });
          })
          .then(function (res) {
            if (!res.ok) {
              showError(
                "请求失败 " +
                  res.status +
                  ": " +
                  (res.body && res.body.error
                    ? JSON.stringify(res.body.error)
                    : JSON.stringify(res.body))
              );
              flowEl.innerHTML =
                '<p class="text-center text-xs text-red-500">加载失败</p>';
              return;
            }
            if (!res.body.parent_task) {
              showError("未找到父任务。");
              flowEl.innerHTML =
                '<p class="text-center text-xs text-slate-500">无数据</p>';
              return;
            }
            loadedPid = pid;
            renderFlow(res.body);
          })
          .catch(function (e) {
            showError("网络错误: " + e.message);
            flowEl.innerHTML =
              '<p class="text-center text-xs text-red-500">网络错误</p>';
          });
      }

      document.getElementById("ptf-load").addEventListener("click", function () {
        var pid = pidInput.value.trim();
        if (pid) {
          var u = new URL(window.location.href);
          u.searchParams.set("pid", pid);
          var base = queryParams().get("base");
          if (base) u.searchParams.set("base", base);
          else u.searchParams.delete("base");
          u.searchParams.delete("taskId");
          window.history.replaceState({}, "", u.pathname + u.search);
        }
        loadParent(pid);
      });

      document.getElementById("ptf-close").addEventListener("click", function () {
        window.close();
      });

      document.getElementById("ptf-expand-close").addEventListener("click", closeExpandModal);
      if (expandStopBtn) {
        expandStopBtn.addEventListener("click", requestExpandAgentAbort);
      }
      if (expandResizeHandle) {
        expandResizeHandle.addEventListener("mousedown", function (e) {
          if (!expandPanel || !expandRoot || expandRoot.classList.contains("hidden")) return;
          e.preventDefault();
          var startHeight = expandPanel.getBoundingClientRect().height;
          expandRoot.classList.add("ptf-expand--resized");
          setExpandPanelHeight(startHeight);
          expandResizeDrag = { startY: e.clientY, startHeight: startHeight };
          document.body.style.cursor = "ns-resize";
          document.body.style.userSelect = "none";
          document.addEventListener("mousemove", onExpandResizeMove);
          document.addEventListener("mouseup", stopExpandResize);
        });
      }
      if (expandBackdrop) {
        expandBackdrop.addEventListener("click", function (e) {
          if (e.target === expandBackdrop) closeExpandModal();
        });
      }
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && expandRoot && !expandRoot.classList.contains("hidden")) {
          closeExpandModal();
        }
      });

      flowEl.addEventListener("click", function (ev) {
        var railNode = ev.target.closest(".ptf-pipeline-rail-node");
        if (railNode) {
          var railTaskId = railNode.getAttribute("data-task-id");
          if (railTaskId) scrollToTask(railTaskId);
          return;
        }
        var expandBtn = ev.target.closest(".ptf-expand-btn");
        if (expandBtn) {
          var article = expandBtn.closest("article");
          if (article) openExpandModal(article, true);
          return;
        }
        var btn = ev.target.closest(".ptf-reexec-btn");
        if (!btn) return;
        var taskId = btn.getAttribute("data-task-id");
        if (taskId) resetTaskToPending(taskId, btn);
      });

      var pidFromUrl = (queryParams().get("pid") || "").trim();
      if (pidFromUrl) {
        pidInput.value = pidFromUrl;
        loadParent(pidFromUrl);
      } else {
        subEl.textContent = "—";
      }
    })();
  </script>

  <!-- 引入Keycloak JS适配器和认证组件 -->
  <script src="../js/keycloak.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var keycloak = new Keycloak({
        url: 'http://pd-keycloak.intelnal.howbuy.com/',
        realm: 'dtms',
        clientId: 'dtms-manager-web',
      });

      keycloak.init({ onLoad: 'login-required' }).then(async (authenticated) => {
        console.log('authenticated' + authenticated);
        if (authenticated) {
          //设置token
          setLocalItem('token', keycloak.token.toString());
          setLocalItem('refreshToken', keycloak.refreshToken.toString());
          setLocalItem('tokenExpire', keycloak.tokenParsed?.exp);
          var tokenParsed = keycloak.tokenParsed;
          var userName = null;
          if (tokenParsed.email) {
            userName = tokenParsed.email.split("@")[0];
          } else {
            userName = tokenParsed["preferred_username"];
          }
          setLocalItem("userName", userName);

          var realName = resolveRealNameFromTokenParsed(tokenParsed);
          if (realName) {
            setLocalItem("realName", realName);
          }
        }
      }).catch((error) => {
        console.error('Keycloak initialization failed', error);
        //keycloakInstance.login();
      });

    });

    function setLocalItem(key, val) {
      if (typeof window === "undefined") {
        return false;
      }
      window.localStorage.setItem(key, val);
      if (key === "userName" && val) {
        document.cookie = "userName=" + encodeURIComponent(String(val)) + "; path=/; SameSite=Lax";
      }
      return true;
    }
  </script>
</body>
