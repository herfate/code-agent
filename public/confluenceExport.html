<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confluence 导出</title>
  <script src="/js/accessUser.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
    input, select { width: 100%; box-sizing: border-box; padding: 0.5rem; }
    button { margin-top: 1rem; padding: 0.6rem 1.2rem; cursor: pointer; margin-right: 0.5rem; }
    #status { margin-top: 1rem; white-space: pre-wrap; color: #333; }
    .err { color: #b00020; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid #ccc; }
    .tabs button { margin: 0; border: none; background: none; padding: 0.5rem 1rem; border-bottom: 2px solid transparent; }
    .tabs button.active { border-bottom-color: #0066cc; font-weight: 600; color: #0066cc; }
    .panel { display: none; }
    .panel.active { display: block; }
    .hint { color: #555; font-size: 0.9rem; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <h1>Confluence 页面导出</h1>
  <div class="tabs">
    <button type="button" id="tab-md" class="active">页面树 → Markdown zip</button>
    <button type="button" id="tab-pdf-tree">页面树 → PDF zip</button>
  </div>

  <div id="panel-md" class="panel active">
    <p>将根页面及子孙页面导出为 txt / md 两套目录（内容相同），并打包 zip 下载（耗时可能较长，请勿关闭页面）。</p>
    <label for="url">Confluence 页面 URL</label>
    <input id="url" type="url" placeholder="http://dms.../pages/viewpage.action?pageId=123 或 /pages/123/..." />
    <label for="scope">范围</label>
    <select id="scope">
      <option value="descendants" selected>全部子孙（descendants）</option>
      <option value="children">直接子页（children）</option>
    </select>
    <button id="btn-md" type="button">导出 zip</button>
  </div>

  <div id="panel-pdf-tree" class="panel">
    <p>将根页面及子孙页面逐页调用 Confluence 内置 FlyingPDF 导出 PDF，打包 zip 下载（每页可能需 1–3 分钟，页面多时请耐心等待）。</p>
    <p class="hint">zip 内含 <code>{父页面名}_pdf/</code> 目录，每页一个 PDF 文件。</p>
    <label for="url-pdf-tree">Confluence 页面 URL</label>
    <input id="url-pdf-tree" type="url" placeholder="http://dms.../pages/viewpage.action?pageId=94533969" />
    <label for="scope-pdf-tree">范围</label>
    <select id="scope-pdf-tree">
      <option value="descendants" selected>全部子孙（descendants）</option>
      <option value="children">直接子页（children）</option>
    </select>
    <button id="btn-pdf-tree" type="button">导出 PDF zip</button>
  </div>

  <div id="status"></div>
  <script>
    const statusEl = document.getElementById("status");
    const tabs = [
      { id: "md", tab: document.getElementById("tab-md"), panel: document.getElementById("panel-md") },
      { id: "pdf-tree", tab: document.getElementById("tab-pdf-tree"), panel: document.getElementById("panel-pdf-tree") },
    ];

    function showPanel(which) {
      for (const t of tabs) {
        const active = t.id === which;
        t.tab.classList.toggle("active", active);
        t.panel.classList.toggle("active", active);
      }
      statusEl.textContent = "";
      statusEl.className = "";
    }
    tabs.forEach((t) => t.tab.addEventListener("click", () => showPanel(t.id)));

    function parseFilename(res) {
      const dispo = res.headers.get("Content-Disposition") || "";
      const m = /filename\*=UTF-8''([^;]+)|filename="([^"]+)"/i.exec(dispo);
      return m ? decodeURIComponent(m[1] || m[2]) : null;
    }

    async function downloadBlob(res, fallbackName) {
      const blob = await res.blob();
      const name = parseFilename(res) || fallbackName;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
      return name;
    }

    async function postExport(path, body, fallbackName) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || res.statusText || "导出失败");
      }
      return downloadBlob(res, fallbackName);
    }

    document.getElementById("btn-md").addEventListener("click", async () => {
      const btn = document.getElementById("btn-md");
      const url = document.getElementById("url").value.trim();
      const scope = document.getElementById("scope").value;
      if (!url) {
        statusEl.textContent = "请填写 Confluence 页面 URL";
        statusEl.className = "err";
        return;
      }
      btn.disabled = true;
      statusEl.className = "";
      statusEl.textContent = "正在拉取并转换，请稍候…";
      try {
        const name = await postExport("/confluence/page-tree-to-markdown", { url, scope }, "confluence_export.zip");
        statusEl.textContent = "下载已开始：" + name;
      } catch (e) {
        statusEl.className = "err";
        statusEl.textContent = e.message || String(e);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("btn-pdf-tree").addEventListener("click", async () => {
      const btn = document.getElementById("btn-pdf-tree");
      const url = document.getElementById("url-pdf-tree").value.trim();
      const scope = document.getElementById("scope-pdf-tree").value;
      if (!url) {
        statusEl.textContent = "请填写 Confluence 页面 URL";
        statusEl.className = "err";
        return;
      }
      btn.disabled = true;
      statusEl.className = "";
      statusEl.textContent = "正在逐页导出 PDF 并打包，请稍候（页面较多时可能需数分钟至数十分钟）…";
      try {
        const name = await postExport("/confluence/page-tree-to-pdf", { url, scope }, "confluence_pdf_export.zip");
        statusEl.textContent = "下载已开始：" + name;
      } catch (e) {
        statusEl.className = "err";
        statusEl.textContent = e.message || String(e);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
