<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务 Agent SSE — 全屏</title>
  <link rel="stylesheet" href="/app.css" />
  <style>
    html.ats-embed-root,
    html.ats-embed-root body.ats-embed {
      height: 100%;
    }
    body.ats-embed header { display: none; }
    body.ats-embed #ats-log { flex: 1; min-height: 0; }
    /* 父任务页「放大」：气泡与工具输出占满可用宽度 */
    body.ats-wide .chat-turn-assistant { width: 100%; }
    body.ats-wide .chat-turn-assistant .chat-bubble { max-width: 100%; width: 100%; }
    body.ats-wide .chat-scroll-pre { max-height: min(70vh, 32rem); }
  </style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-slate-50 text-slate-900 antialiased">
  <header id="ats-header" class="flex shrink-0 items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3 shadow-sm sm:px-5">
    <div class="min-w-0">
      <h1 id="ats-title" class="text-sm font-semibold text-slate-800">Agent（任务流）</h1>
      <p id="ats-sub" class="mt-0.5 truncate font-mono text-xs text-slate-500"></p>
      <p id="ats-err" class="mt-1 hidden text-xs text-red-600"></p>
    </div>
    <div class="flex shrink-0 flex-wrap items-center gap-2">
      <button
        type="button"
        id="ats-stop"
        class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-1.5 text-xs font-medium text-amber-900 hover:bg-amber-100 disabled:cursor-not-allowed disabled:opacity-50"
        disabled
      >
        停止
      </button>
      <button
        type="button"
        id="ats-close"
        class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50"
      >
        关闭窗口
      </button>
    </div>
  </header>
  <main
    id="ats-log"
    class="chat-log"
    role="log"
    aria-live="polite"
  ></main>
  <script src="/js/claude-sse-render.js"></script>
  <script src="/js/cursor-sse-render.js"></script>
  <script>
    (function () {
      var logEl = document.getElementById("ats-log");
      var subEl = document.getElementById("ats-sub");
      var titleEl = document.getElementById("ats-title");
      var errEl = document.getElementById("ats-err");
      var stopBtn = document.getElementById("ats-stop");
      var streamAbort = null;
      var provider = "claude";
      var render = null;

      function queryParams() {
        return new URLSearchParams(window.location.search);
      }

      function normalizeProvider(raw) {
        return String(raw || "").trim().toLowerCase() === "cursor" ? "cursor" : "claude";
      }

      function applyProvider(next) {
        provider = normalizeProvider(next);
        render = provider === "cursor" ? window.CursorSseRender : window.ClaudeSseRender;
        if (titleEl) {
          titleEl.textContent =
            provider === "cursor" ? "Cursor Agent（任务流）" : "Claude Agent（任务流）";
        }
      }

      if (
        queryParams().get("embed") === "1" ||
        queryParams().get("embed") === "true"
      ) {
        document.documentElement.classList.add("ats-embed-root");
        document.body.classList.add("ats-embed");
        document.body.classList.remove("h-screen");
        document.body.classList.add("h-full", "min-h-0");
      }
      if (
        queryParams().get("wide") === "1" ||
        queryParams().get("wide") === "true"
      ) {
        document.body.classList.add("ats-wide");
      }

      function apiBase() {
        var b = queryParams().get("base");
        if (b && String(b).trim()) return String(b).trim().replace(/\/$/, "");
        return window.location.origin;
      }

      function streamPath() {
        return provider === "cursor" ? "cursor-agent-stream" : "claude-agent-stream";
      }

      function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.remove("hidden");
      }

      function appendEvent(eventName, payload) {
        if (render) render.appendEvent(logEl, eventName, payload);
      }

      function appendSystem(text, variant) {
        if (render) render.appendSystemLine(logEl, text, variant);
      }

      function setStopEnabled(on) {
        stopBtn.disabled = !on;
      }

      function abortStream() {
        if (streamAbort) {
          try {
            streamAbort.abort();
          } catch (e) {}
          streamAbort = null;
        }
        setStopEnabled(false);
      }

      async function parseSseStream(response, onEvent) {
        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var buffer = "";
        while (true) {
          var res = await reader.read();
          if (res.done) break;
          buffer += decoder.decode(res.value, { stream: true });
          var sep;
          while ((sep = buffer.indexOf("\n\n")) !== -1) {
            var block = buffer.slice(0, sep);
            buffer = buffer.slice(sep + 2);
            var eventName = "message";
            var dataLines = [];
            block.split(/\r?\n/).forEach(function (line) {
              if (line.startsWith("event:")) eventName = line.slice(6).trim();
              else if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
            });
            var dataStr = dataLines.join("\n");
            if (!dataStr) continue;
            var payload;
            try {
              payload = JSON.parse(dataStr);
            } catch (e) {
              payload = dataStr;
            }
            onEvent(eventName, payload);
          }
        }
      }

      function startStream(taskId) {
        abortStream();
        if (render) render.clearLog(logEl);
        else logEl.innerHTML = "";
        subEl.textContent = "task " + taskId + " (" + provider + ")";
        var ac = new AbortController();
        streamAbort = ac;
        setStopEnabled(true);
        var lastSeq = 0;
        var url =
          apiBase() +
          "/api/tasks/" +
          encodeURIComponent(taskId) +
          "/" +
          streamPath() +
          "?afterSeq=" +
          encodeURIComponent(String(lastSeq));
        fetch(url, { signal: ac.signal })
          .then(function (r) {
            if (!r.ok) {
              return r.text().then(function (t) {
                appendSystem("HTTP " + r.status + (t ? ": " + t : ""), "error");
              });
            }
            return parseSseStream(r, function (eventName, payload) {
              if (eventName === "done") {
                appendEvent("done", payload);
                return;
              }
              if (eventName === "error") {
                appendEvent("error", payload);
                return;
              }
              if (payload && typeof payload === "object" && typeof payload.seq === "number") {
                lastSeq = Math.max(lastSeq, payload.seq);
              }
              appendEvent("message", payload);
            }).then(function () {
              if (render && render.appendEndMarker) render.appendEndMarker(logEl, false);
            });
          })
          .catch(function (err) {
            if (err && err.name !== "AbortError") {
              appendSystem(err.message ? err.message : String(err), "error");
            }
          })
          .finally(function () {
            if (streamAbort === ac) {
              streamAbort = null;
              setStopEnabled(false);
            }
          });
      }

      stopBtn.addEventListener("click", abortStream);
      document.getElementById("ats-close").addEventListener("click", function () {
        abortStream();
        window.close();
      });
      window.addEventListener("beforeunload", abortStream);

      var taskId = (queryParams().get("taskId") || "").trim();
      if (!taskId) {
        showError("缺少 URL 参数 taskId，无法订阅 SSE。");
        subEl.textContent = "—";
        return;
      }
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(taskId)) {
        showError("taskId 格式无效，应为 UUID。");
        return;
      }

      applyProvider(queryParams().get("provider"));
      if (!render) {
        showError("渲染脚本加载失败，请刷新页面。");
        return;
      }
      startStream(taskId);
    })();
  </script>
</body>
</html>
