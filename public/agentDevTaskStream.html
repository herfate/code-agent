<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务 Agent SSE — 全屏</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="/js/accessUser.js"></script>
  <style>
    html.ats-embed-root,
    html.ats-embed-root body.ats-embed {
      height: 100%;
    }
    body.ats-embed header { display: none; }
    body.ats-embed #ats-log { flex: 1; min-height: 0; }
    /* 父任务页「放大」：气泡与工具输出占满可用宽度 */
    body.ats-wide .chat-turn-assistant { width: 100%; }
    body.ats-wide .chat-turn-assistant .chat-bubble { max-width: 100%; width: 100%; }
    body.ats-wide .chat-scroll-pre { max-height: min(70vh, 32rem); }
  </style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-slate-50 text-slate-900 antialiased">
  <header id="ats-header" class="flex shrink-0 items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3 shadow-sm sm:px-5">
    <div class="min-w-0">
      <h1 id="ats-title" class="text-sm font-semibold text-slate-800">Agent（任务流）</h1>
      <p id="ats-sub" class="mt-0.5 truncate font-mono text-xs text-slate-500"></p>
      <p id="ats-err" class="mt-1 hidden text-xs text-red-600"></p>
    </div>
    <div class="flex shrink-0 flex-wrap items-center gap-2">
      <button
        type="button"
        id="ats-stop"
        class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-1.5 text-xs font-medium text-amber-900 hover:bg-amber-100 disabled:cursor-not-allowed disabled:opacity-50"
        disabled
      >
        停止
      </button>
      <button
        type="button"
        id="ats-close"
        class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50"
      >
        关闭窗口
      </button>
    </div>
  </header>
  <main
    id="ats-log"
    class="chat-log min-h-0 flex-1"
    role="log"
    aria-live="polite"
  ></main>
  <footer
    id="ats-followup"
    class="shrink-0 border-t border-slate-200 bg-white px-4 py-3 sm:px-5"
  >
    <p class="mb-2 text-[11px] text-slate-500">输入补充说明后点击「发送」；发送成功后请刷新页面。</p>
    <textarea
      id="ats-followup-input"
      rows="3"
      maxlength="50000"
      placeholder="例如：请再补充单元测试…"
      class="mb-2 w-full resize-y rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/25"
    ></textarea>
    <div class="flex flex-wrap items-center gap-2">
      <button
        type="button"
        id="ats-followup-submit"
        class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        发送
      </button>
      <span id="ats-followup-hint" class="text-xs text-slate-500"></span>
    </div>
  </footer>
  <script src="/js/claude-sse-render.js"></script>
  <script src="/js/cursor-sse-render.js"></script>
  <script>
    (function () {
      var logEl = document.getElementById("ats-log");
      var subEl = document.getElementById("ats-sub");
      var titleEl = document.getElementById("ats-title");
      var errEl = document.getElementById("ats-err");
      var stopBtn = document.getElementById("ats-stop");
      var followupInput = document.getElementById("ats-followup-input");
      var followupSubmit = document.getElementById("ats-followup-submit");
      var followupHint = document.getElementById("ats-followup-hint");
      var streamAbort = null;
      var currentTaskId = "";
      var provider = "claude";
      var render = null;

      function queryParams() {
        return new URLSearchParams(window.location.search);
      }

      function normalizeProvider(raw) {
        return String(raw || "").trim().toLowerCase() === "cursor" ? "cursor" : "claude";
      }

      function alternateProvider(p) {
        return p === "cursor" ? "claude" : "cursor";
      }

      function parseRunIdFromMeta(metaJson, key) {
        if (!metaJson || !String(metaJson).trim()) return null;
        try {
          var o = JSON.parse(metaJson);
          var v = o && o[key];
          return typeof v === "string" && v.trim() ? v.trim() : null;
        } catch (e) {
          return null;
        }
      }

      /** 优先 URL 指定线路；若无 run 记录则切换至另一 provider */
      function resolveStreamProvider(taskId, preferred) {
        preferred = normalizeProvider(preferred);
        return fetch(apiBase() + "/api/tasks/" + encodeURIComponent(taskId))
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, body: j };
            });
          })
          .then(function (res) {
            if (!res.ok || !res.body || !res.body.task) {
              return { provider: preferred, switched: false };
            }
            var meta = res.body.task.meta_json;
            var hasClaude = !!parseRunIdFromMeta(meta, "claudeAgentRunId");
            var hasCursor = !!parseRunIdFromMeta(meta, "cursorAgentRunId");
            if (preferred === "cursor") {
              if (hasCursor) return { provider: "cursor", switched: false };
              if (hasClaude) return { provider: "claude", switched: true };
            } else {
              if (hasClaude) return { provider: "claude", switched: false };
              if (hasCursor) return { provider: "cursor", switched: true };
            }
            return { provider: preferred, switched: false };
          })
          .catch(function () {
            return { provider: preferred, switched: false };
          });
      }

      function applyProvider(next) {
        provider = normalizeProvider(next);
        render = provider === "cursor" ? window.CursorSseRender : window.ClaudeSseRender;
        if (titleEl) {
          titleEl.textContent =
            provider === "cursor" ? "Cursor Agent（任务流）" : "Claude Agent（任务流）";
        }
      }

      if (
        queryParams().get("embed") === "1" ||
        queryParams().get("embed") === "true"
      ) {
        document.documentElement.classList.add("ats-embed-root");
        document.body.classList.add("ats-embed");
        document.body.classList.remove("h-screen");
        document.body.classList.add("h-full", "min-h-0");
      }
      if (
        queryParams().get("wide") === "1" ||
        queryParams().get("wide") === "true"
      ) {
        document.body.classList.add("ats-wide");
      }

      function apiBase() {
        var b = queryParams().get("base");
        if (b && String(b).trim()) return String(b).trim().replace(/\/$/, "");
        return window.location.origin;
      }

      function streamPath() {
        return provider === "cursor" ? "cursor-agent-stream" : "claude-agent-stream";
      }

      function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.remove("hidden");
      }

      /** tone: default | success | error */
      function setFollowupHint(text, tone) {
        if (!followupHint) return;
        followupHint.textContent = text;
        followupHint.classList.remove("text-slate-500", "text-green-600", "text-red-600");
        if (tone === "success") followupHint.classList.add("text-green-600");
        else if (tone === "error") followupHint.classList.add("text-red-600");
        else followupHint.classList.add("text-slate-500");
      }

      function appendEvent(eventName, payload) {
        if (render) render.appendEvent(logEl, eventName, payload);
      }

      function appendSystem(text, variant) {
        if (render) render.appendSystemLine(logEl, text, variant);
      }

      function setStopEnabled(on) {
        stopBtn.disabled = !on;
      }

      function abortClientStream() {
        if (streamAbort) {
          try {
            streamAbort.abort();
          } catch (e) {}
          streamAbort = null;
        }
        setStopEnabled(false);
      }

      function requestAgentAbort() {
        if (!currentTaskId) return;
        setStopEnabled(false);
        appendSystem("正在停止 Agent…", "default");
        fetch(apiBase() + "/api/tasks/" + encodeURIComponent(currentTaskId) + "/agent-abort", {
          method: "POST",
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, status: r.status, body: j };
            });
          })
          .then(function (res) {
            if (res.ok && res.body && res.body.ok) {
              appendSystem("已发送停止请求，等待 Agent 结束…", "default");
              return;
            }
            var msg =
              res.body && res.body.error
                ? typeof res.body.error === "string"
                  ? res.body.error
                  : JSON.stringify(res.body.error)
                : "停止失败 HTTP " + res.status;
            appendSystem(msg, "error");
          })
          .catch(function (e) {
            appendSystem("停止请求失败: " + e.message, "error");
          });
      }

      async function parseSseStream(response, onEvent) {
        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var buffer = "";
        while (true) {
          var res = await reader.read();
          if (res.done) break;
          buffer += decoder.decode(res.value, { stream: true });
          var sep;
          while ((sep = buffer.indexOf("\n\n")) !== -1) {
            var block = buffer.slice(0, sep);
            buffer = buffer.slice(sep + 2);
            var eventName = "message";
            var dataLines = [];
            block.split(/\r?\n/).forEach(function (line) {
              if (line.startsWith("event:")) eventName = line.slice(6).trim();
              else if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
            });
            var dataStr = dataLines.join("\n");
            if (!dataStr) continue;
            var payload;
            try {
              payload = JSON.parse(dataStr);
            } catch (e) {
              payload = dataStr;
            }
            onEvent(eventName, payload);
          }
        }
      }

      function submitFollowUp() {
        if (!currentTaskId) return;
        var text = followupInput && followupInput.value ? followupInput.value.trim() : "";
        if (!text) {
          setFollowupHint("请先输入内容", "default");
          return;
        }
        if (followupSubmit) followupSubmit.disabled = true;
        setFollowupHint("发送中…", "default");
        fetch(apiBase() + "/api/tasks/" + encodeURIComponent(currentTaskId) + "/follow-up", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, status: r.status, body: j };
            });
          })
          .then(function (res) {
            if (followupSubmit) followupSubmit.disabled = false;
            if (!res.ok) {
              setFollowupHint(
                "发送失败 " +
                  res.status +
                  ": " +
                  (res.body && res.body.error
                    ? typeof res.body.error === "string"
                      ? res.body.error
                      : JSON.stringify(res.body.error)
                    : JSON.stringify(res.body)),
                "error",
              );
              return;
            }
            if (followupInput) followupInput.value = "";
            setFollowupHint("发送成功，请刷新页面", "success");
          })
          .catch(function (e) {
            if (followupSubmit) followupSubmit.disabled = false;
            setFollowupHint("网络错误: " + e.message, "error");
          });
      }

      function connectStream(taskId, ac, allowProviderFallback) {
        var lastSeq = 0;
        var url =
          apiBase() +
          "/api/tasks/" +
          encodeURIComponent(taskId) +
          "/" +
          streamPath() +
          "?afterSeq=" +
          encodeURIComponent(String(lastSeq));
        return fetch(url, { signal: ac.signal })
          .then(function (r) {
            if (!r.ok) {
              if (r.status === 404 && allowProviderFallback) {
                var alt = alternateProvider(provider);
                applyProvider(alt);
                subEl.textContent = "task " + taskId + " (" + provider + ")";
                appendSystem(
                  "当前线路无 Agent 记录，已切换至 " + (provider === "cursor" ? "Cursor" : "Claude"),
                  "default",
                );
                return connectStream(taskId, ac, false);
              }
              return r.text().then(function (t) {
                appendSystem("HTTP " + r.status + (t ? ": " + t : ""), "error");
              });
            }
            return parseSseStream(r, function (eventName, payload) {
              if (eventName === "done") {
                appendEvent("done", payload);
                return;
              }
              if (eventName === "error") {
                appendEvent("error", payload);
                return;
              }
              if (payload && typeof payload === "object" && typeof payload.seq === "number") {
                lastSeq = Math.max(lastSeq, payload.seq);
              }
              appendEvent("message", payload);
            }).then(function () {
              if (render && render.appendEndMarker) render.appendEndMarker(logEl, false);
            });
          });
      }

      function startStream(taskId) {
        currentTaskId = taskId;
        abortClientStream();
        if (render) render.clearLog(logEl);
        else logEl.innerHTML = "";
        subEl.textContent = "task " + taskId + " · 加载线路…";
        var ac = new AbortController();
        streamAbort = ac;
        setStopEnabled(true);
        resolveStreamProvider(taskId, provider)
          .then(function (resolved) {
            if (streamAbort !== ac) return;
            if (resolved.provider !== provider) applyProvider(resolved.provider);
            subEl.textContent = "task " + taskId + " (" + provider + ")";
            if (resolved.switched) {
              appendSystem(
                "当前线路无 Agent 记录，已切换至 " + (provider === "cursor" ? "Cursor" : "Claude"),
                "default",
              );
            }
            return connectStream(taskId, ac, !resolved.switched);
          })
          .catch(function (err) {
            if (err && err.name !== "AbortError") {
              appendSystem(err.message ? err.message : String(err), "error");
            }
          })
          .finally(function () {
            if (streamAbort === ac) {
              streamAbort = null;
              setStopEnabled(false);
            }
          });
      }

      stopBtn.addEventListener("click", requestAgentAbort);
      if (followupSubmit) followupSubmit.addEventListener("click", submitFollowUp);
      document.getElementById("ats-close").addEventListener("click", function () {
        abortClientStream();
        window.close();
      });
      window.addEventListener("beforeunload", abortClientStream);

      var taskId = (queryParams().get("taskId") || "").trim();
      if (!taskId) {
        showError("缺少 URL 参数 taskId，无法订阅 SSE。");
        subEl.textContent = "—";
        return;
      }
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(taskId)) {
        showError("taskId 格式无效，应为 UUID。");
        return;
      }

      applyProvider(queryParams().get("provider"));
      if (!render) {
        showError("渲染脚本加载失败，请刷新页面。");
        return;
      }
      startStream(taskId);
    })();
  </script>

</body>
</html>
